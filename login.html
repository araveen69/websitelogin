<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-container {
            background: #fff;
            padding: 32px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 340px;
            position: relative;
        }
        .exit-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #e53935;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .exit-btn:hover {
            background: #b71c1c;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        .forgot-password {
            display: block;
            margin-bottom: 18px;
            text-align: right;
            font-size: 0.95em;
        }
        .forgot-password a {
            color: #1976d2;
            text-decoration: none;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
        }
        .login-btn:hover {
            background: #145ea8;
        }
        .error-message {
            color: #c00;
            margin-bottom: 10px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <button class="exit-btn" id="exitBtn" title="Exit">&times;</button>
        <h2>Login</h2>
        <div id="error" class="error-message">Invalid username or password</div>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>
            </div>
            <div class="forgot-password">
                <a href="#" onclick="alert('Forgot password functionality not implemented.'); return false;">Forgot Password?</a>
            </div>
            <button class="login-btn" type="submit">Login</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Demo credentials: user / password
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            if (username === 'user' && password === 'password') {
                errorDiv.style.display = 'none';
                alert('Login successful!');
                // Redirect to another page or proceed as needed
            } else {
                errorDiv.style.display = 'block';
            }
        });

        document.getElementById('exitBtn').addEventListener('click', function() {
            // Attempt to close the window if possible, otherwise redirect to a safe page
            if (window.close) {
                window.close();
            }
            window.location.href = "https://www.google.com";
        });
    </script>
</body>
</html>
